title: Interpreter Child of IIS Worker
id: 54260723-88ed-4f42-9357-7f4e32b55102
status: experimental
description: A direct IIS worker child is a command or script interpreter; context is required to assess maliciousness.
author: Quoc Bao Huynh (AI-assisted lab implementation)
date: 2026-09-19
references:
  - https://learn.microsoft.com/en-us/aspnet/core/host-and-deploy/iis/in-process-hosting
  - https://attack.mitre.org/techniques/T1059/003/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith: '\w3wp.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cscript.exe'
      - '\wscript.exe'
  condition: selection
falsepositives:
  - Legacy export or maintenance routines that deliberately invoke interpreters
level: medium
tags:
  - attack.execution
  - attack.t1059.003
