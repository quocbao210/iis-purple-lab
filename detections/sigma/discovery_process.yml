title: Identity or Host Discovery Process Candidate
id: 88fc9330-725b-42b0-a0d4-52954c245303
status: experimental
description: Event-level discovery candidate; Python limits alerts to a supported IIS process ancestry.
author: Quoc Bao Huynh (AI-assisted lab implementation)
date: 2026-09-19
references:
  - https://attack.mitre.org/techniques/T1033/
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\whoami.exe'
      - '\hostname.exe'
  condition: selection
falsepositives:
  - Operator inventory and diagnostics
level: low
