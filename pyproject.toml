[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "iis-purple-lab"
version = "0.1.0"
description = "Portable preview of an evidence-linked Windows IIS purple-team lab"
requires-python = ">=3.11"
dependencies = ["pysigma-backend-sqlite==1.2.4", "defusedxml==0.7.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
iis-purple = "iis_purple.cli:main"

[tool.setuptools.packages.find]
where = ["analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["analysis"]
addopts = "-ra"
